name: Build SwiftGate unsigned IPA

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 180
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
      SWIFTGATE_APPLE_REF: b1daf888efa6a5b80d668257ba540e600384d626
      SWIFTGATE_CORE_REF: 3e16ce764818796996c1be3f12b0c6008808cf34
      SWIFTGATE_LIBBOX_PLATFORMS: ios
    steps:
      - name: Check out build payload
        uses: actions/checkout@v7

      - name: Select Go toolchain
        uses: actions/setup-go@v7
        with:
          go-version: 1.26.5
          cache: false

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Extract verified SwiftGate source
        run: |
          unzip -q SwiftGate-iOS-0.2.0-CI-Ready.zip -d SwiftGate-iOS
          chmod +x SwiftGate-iOS/Scripts/*.sh
          python3 - <<'PY'
          from pathlib import Path
          path = Path("SwiftGate-iOS/project-with-core.yml")
          source = path.read_text(encoding="utf-8")
          needle = "      - framework: Frameworks/Libbox.xcframework\n"
          replacement = needle + "      - sdk: libresolv.tbd\n      - sdk: SystemConfiguration.framework\n"
          if source.count(needle) != 1:
              raise SystemExit("Unexpected project-with-core.yml structure")
          path.write_text(source.replace(needle, replacement), encoding="utf-8")
          PY
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(relative_path, old, new):
              path = Path("SwiftGate-iOS") / relative_path
              source = path.read_text(encoding="utf-8")
              if source.count(old) != 1:
                  raise SystemExit(f"Unexpected {relative_path} structure: {old!r}")
              path.write_text(source.replace(old, new), encoding="utf-8")

          replace_once("Features/Import/ImportView.swift", '                Section("已保存的订阅") {', '                Section {')
          replace_once("Features/Import/ImportView.swift", '                } footer: {\n                    Text("更新失败时继续使用上一份有效配置。")', '                } header: {\n                    Text("已保存的订阅")\n                } footer: {\n                    Text("更新失败时继续使用上一份有效配置。")')
          replace_once("Features/Nodes/NodesView.swift", '                    Section("可用节点") {', '                    Section {')
          replace_once("Features/Nodes/NodesView.swift", '                    } footer: {\n                        Text("无需先连接：选择会用于下次连接，测速只检查节点的网络延迟。")', '                    } header: {\n                        Text("可用节点")\n                    } footer: {\n                        Text("无需先连接：选择会用于下次连接，测速只检查节点的网络延迟。")')
          replace_once("Features/Settings/SettingsView.swift", '            Section("订阅") {', '            Section {')
          replace_once("Features/Settings/SettingsView.swift", '            } footer: {\n                Text("App 在前台时按所选周期检查；新配置验证失败会继续使用上一份有效配置。")', '            } header: {\n                Text("订阅")\n            } footer: {\n                Text("App 在前台时按所选周期检查；新配置验证失败会继续使用上一份有效配置。")')
          replace_once("Services/TunnelManager.swift", '    private var statusObserver: NSObjectProtocol?', '    @ObservationIgnored\n    nonisolated(unsafe) private var statusObserver: NSObjectProtocol?')
          PY

      - name: Build native core and unsigned IPA
        working-directory: SwiftGate-iOS
        run: bash Scripts/build-unsigned-ipa.sh

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v7
        with:
          name: SwiftGate-Unsigned-IPA
          path: |
            SwiftGate-iOS/.build/artifacts/SwiftGate-Unsigned.ipa
            SwiftGate-iOS/.build/artifacts/SwiftGate-Unsigned.ipa.sha256
            SwiftGate-iOS/.build/artifacts/Build-Info.txt
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
